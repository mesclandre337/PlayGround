function move(f,dx,dz,dt){let mag=Math.min(1,Math.hypot(dx,dz)),[nx,nz]=norm(dx,dz),speed=heroes[f.index].speed*(f.dash>0?2.45:1);f.vx+=(nx*speed*mag-f.vx)*Math.min(1,dt*11);f.vz+=(nz*speed*mag-f.vz)*Math.min(1,dt*11);let x=f.x+f.vx*dt,z=f.z+f.vz*dt;if(!blocked(x,f.z,f.r))f.x=x;else f.vx*=-.2;if(!blocked(f.x,z,f.r))f.z=z;else f.vz*=-.2;f.x=clamp(f.x,-14.5,14.5);f.z=clamp(f.z,-9.6,9.6);}

 for(const f of fighters){if(!f.alive){f.respawn-=dt;if(f.respawn<=0){f.alive=true;f.hp=f.max;f.x=f.team?12:-12;f.z=(Math.random()-.5)*3;f.model.visible=true;burst(f.x,f.z,heroes[f.index].color,14)}continue}f.fire-=dt;f.dash=Math.max(0,f.dash-dt);f.super=Math.min(100,f.super);if(f.hp<f.max)f.hp=Math.min(f.max,f.hp+dt*2.7);

 }

 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.mesh.position.x+=p.vx*dt;p.mesh.position.z+=p.vz*dt;p.mesh.position.y+=dt*(.4+p.life);p.life-=dt;if(p.life<=0){arena.remove(p.mesh);particles.splice(i,1)}}relic.rotation.y+=dt*.7;crystal.rotation.y-=dt*1.4;crystal.rotation.z+=dt*.7;relic.position.y=.12+Math.sin(elapsed*2.5)*.11;shake=Math.max(0,shake-dt);}

function screenAim(e){const rect=canvas.getBoundingClientRect();pointer.x=((e.clientX-rect.left)/rect.width)*2-1;pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(pointer,camera);raycaster.ray.intersectPlane(groundPlane,aimPoint);mouse.x=aimPoint.x;mouse.z=aimPoint.z;mouse.moved=true;}

addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='Space'){let p=fighters.find(f=>f.player);if(p)superMove(p)}if(e.code==='ShiftLeft'||e.code==='ShiftRight'){let p=fighters.find(f=>f.player);if(p&&state==='playing'&&performance.now()-lastDash>1100){p.dash=.22;lastDash=performance.now();burst(p.x,p.z,'#9bfff0',8)}}});addEventListener('keyup',e=>keys[e.code]=false);

function draw(){if(state==='playing'){const player=fighters.find(f=>f.player);if(player){const target=new THREE.Vector3(player.x*.24,0,player.z*.24);camera.position.x+=(target.x-camera.position.x)*.04;camera.position.z+=(25+target.z-camera.position.z)*.04;camera.lookAt(target.x,0,target.z)}}if(shake>0&&state==='playing'){camera.position.x+=(Math.random()-.5)*shake;camera.position.z+=(Math.random()-.5)*shake;}renderer.render(scene,camera);}
